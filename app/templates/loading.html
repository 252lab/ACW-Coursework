<!-- Starting webpage -->
<!-- importing character set-->
<meta charset="UTF-8">

<!-- importing css pages-->
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/loader.css">

<!-- header -->
<head style="font-family: Arial, Helvetica, sans-serif; background-color: #5C6BC0;">
    <!-- meta tags for formatting-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* setting the height of the page + location on loading symbol */
            .container {
                display: grid;
                /* set height of the container to the viewport height */
                height: 100vh;
                /* to center the grid items both horizontally and vertically */
                place-items: center;
        }
    </style>
</head>

<!-- body-->
<body style="font-family: Arial, Helvetica, sans-serif; background-color: #5C6BC0;">
<!-- calling the loading sign-->
<div class="loader"></div>
</body>

<!-- Page footer-->
<footer>
    <div class="footer" style="font-family: Arial, Helvetica, sans-serif; background-color: #5C6BC0;">
        <div style="text-align: center;">
            <p>Content copyright © 2026.</p>
        </div>
    </div>
</footer>
