[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
ignore = ["E501", "W503"]
exclude = [".venv", "__pycache__"]

[tool.pytest.ini_options]
markers = [
	"integration: tests that call the live TfL API and require network access",
	"endtoend: full journey tests that simulate a user flow through the system",
	"mock: tests that use mocked responses and do not require network access",
]
