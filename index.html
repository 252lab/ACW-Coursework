<!-- Starting webpage -->
<!-- importing character set-->
<meta charset="UTF-8">

<!-- importing css pages-->
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/columns.css">
<link rel="stylesheet" href="css/padding.css">
<link rel="stylesheet" href="css/rectangle.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/map.css">
<link rel="stylesheet" href="css/tabs.css">


<!-- header-->

<head style="font-family: Arial, Helvetica, sans-serif; background-color: #5C6BC0;">

    <!-- adding padding -->
    <br>
    <br>

    <!-- meta tags for formatting-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <h1 style="color: white; text-align: center; padding: 5px; "> London Tube Route Planner</h1>
</head>

<!-- main body of the webpage-->
<!-- linking to js file-->
 <script src="javascript/tabs.js"></script>

<body style="font-family: Arial, Helvetica, sans-serif; background-color: #5C6BC0;">

    <br>
    <hr class="solid" style="color: white;">
    <br>

    <div class="padding row">
        <div class="column">
            <div class="rectangle">

                <!-- TODO make some inputs required-->

                <!-- Message about using tube stops -->
                <p style="text-align: center; padding-top: 10px;">Please enter your start and end tube stops, and your
                    start or end time.
                </p>
                <br>
                <p style="text-align: center; padding-top: 10px;">
                    Your start and end stops are required. Please only enter the start time or the end time, if a time
                    is entered.
                </p>
                <br>

                <!-- input form-->
                <form style="text-align: center;" method="post" action="{{url_for('route_input')}}">

                    <!-- entering locations-->
                    <!-- the locations are required-->
                    <label for="startLocation">Start Location*:</label>
                    <input type="text" id="startLocation" name="startLocation" required>
                    <br>

                    <label for="endLocation">End Location*:</label>
                    <input type="text" id="endLocation" name="endLocation" required>
                    <br>

                    <!-- entering start and end times-->
                    <!-- the user can only enter one or the other-->
                    <!-- Tabs based on 
                        https://www.w3schools.com/howto/howto_js_tabs.asp -->

                    <!-- Tab links -->
                    <div class="tab">
                        <button class="tablinks" type="button" onclick="openTime(event, 'start')">Start Time</button>
                        <button class="tablinks" type="button" onclick="opentime(event, 'end')">End Time</button>

                    </div>

                    <!-- Tab content -->
                    <!-- the tab for submitting the start time of the suer's journey -->
                    <div id="start" class="tabcontent">
                        <label for="startTime">Start Time:</label>
                        <input type="time" id="startTime" name="startTime">
                        <br>

                    </div>


                    <!-- the tab for submitting the end time of the user's journey-->
                    <div id="end" class="tabcontent">

                        <label for="endTime">End Time:</label>
                        <input type="time" id="endTime" name="endTime">
                        <br>

                    </div>

                    <!-- submit button -->
                    <input type="submit" value="Submit">

                </form>

            </div>

        </div>

        <!-- the column where the map is-->
        <div class="column">
            <!-- centering the map-->
            <div class="map-container">
                <!-- importing and formatting the map-->
                <iframe src=https://traintimes.org.uk/map/tube/ allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>
    </div>
</body>

<!-- Page footer-->
<footer>
    <div class="footer" style="font-family: Arial, Helvetica, sans-serif; background-color: #5C6BC0;">
        <div style="text-align: center;">
            <p>Content copyright © 2026.</p>
        </div>
    </div>
</footer>
