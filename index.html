<!-- Starting webpage -->
<!-- importing character set-->
<meta charset="UTF-8">

<!-- importing css pages-->
<link rel="stylesheet" href="css/footer.css">

<!-- header-->

<head style="font-family: Arial, Helvetica, sans-serif; background-color: #5C6BC0;">
    <!-- meta tags for formatting-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <h1 style="color: white; text-align: center;"> London Tube Route Planner</h1>
</head>

<!-- main body of the webpage-->

<!--

Left column
Form:
Start point
End point

Start time
end time

take into account current location and time

Right column:
Map
-->

<body style="font-family: Arial, Helvetica, sans-serif; background-color: #5C6BC0;">

    <div class="padding" class="row">
        <div class="column">
            <div class="rectangle">

                <!-- Message about using bas stops -->
                <p style="text-align: center;">Please enter your start and end bus stops, and your start and end times.
                </p>
                <br>

                <!-- input form-->
                <form style="text-align: center;" method="post">
                    <!-- entering locations-->
                    <label for="startLocation">Start Location:</label>
                    <input type="text" id="startLocation" name="startLocation">
                    <br>

                    <label for="endLocation">End Location:</label>
                    <input type="text" id="endLocation" name="endLocation">
                    <br>

                    <!-- entering start and end times-->

                    <label for="startTime">Start Time:</label>
                    <input type="time" id="startTime" name="startTime">
                    <br>

                    <label for="endTime">End Time:</label>
                    <input type="time" id="endTime" name="endTime">
                    <br>

                    <!-- start and end times-->
                    <input type="submit" value="Submit">
                </form>

            </div>

        </div>

        <!-- the column where the map is-->
        <div class="column">
            <!-- centering the map-->
            <div style="text-align: center;">
                <!-- importing and formatting the map-->
            </div>
        </div>
    </div>
</body>

<!-- Page footer-->
<footer>

        </div>
    </div>
